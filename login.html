<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Admin - E2C Reims</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1A4C95 0%,#DC3545 100%);position:relative;overflow:hidden}
.bg-blob{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%;animation:float 8s ease-in-out infinite}
.blob1{top:-100px;left:-100px} .blob2{bottom:-100px;right:-100px;animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.card{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-radius:24px;padding:32px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;z-index:2}
.card img{height:48px;margin-bottom:12px}
.card h1{font-family:'Outfit';font-size:22px;color:#1A4C95;margin:8px 0}
.card p{color:#6B7280;font-size:13px;margin-bottom:18px}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #E9ECF2;background:#F8F9FB;margin:8px 0;font-size:14px}
.card button{width:100%;margin-top:10px;background:linear-gradient(135deg,#1A4C95,#DC3545);color:white;border:none;padding:12px;border-radius:999px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(26,76,149,0.3);transition:.2s}
.card button:hover{transform:translateY(-2px)}
.error{color:#DC3545;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="bg-blob blob1"></div><div class="bg-blob blob2"></div>
<div class="card">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/E2C_logo.png/320px-E2C_logo.png">
  <h1>Espace Responsable</h1>
  <p>Accès réservé à l'équipe E2C Reims</p>
  <input id="user" placeholder="Identifiant (ex: admin)">
  <input id="pass" type="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter →</button>
  <div id="err" class="error">Identifiant ou mot de passe incorrect</div>
  <p style="font-size:11px;color:#9CA3AF;margin-top:14px">Démo : admin / e2c2025</p>
</div>
<script>
function login(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(u==='admin' && p==='e2c2025'){
    localStorage.setItem('e2c_admin','1');
    location.href='index.html';
  } else { document.getElementById('err').style.display='block'; }
}
</script>
</body>
</html>
